# Lincolnsoft Server – Docker Compose
# Quelle: Repo lincolnsoft-homestation/deploy/server/docker-compose.yml – deploy/update.sh übernimmt Änderungen
# automatisch nach ~/server/docker-compose.yml (vorher geprüft, Sicherung als docker-compose.yml.bak).

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: ${HOME}/.config/lincolnsoft/gemini.env   # GEMINI_API_KEY für den Foto-Coach-Proxy; legt update.sh leer an, falls sie fehlt
    logging: *logging

  # Kontaktformular (Versand über Gmail) + anonymer Aufrufzähler – nur Python-Standardbibliothek
  api:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/kontakt.py"]
    working_dir: /app
    volumes:
      - ../repos/lincolnsoft-homestation/deploy/kontakt:/app:ro
      - ./data/api:/data
    env_file: ${HOME}/.config/lincolnsoft/kontakt.env   # legt update.sh leer an, falls sie fehlt
    logging: *logging

  # Steelrumble – dedizierter Spielserver, 4 Spielräume (WebSocket auf 24556–24559, nur intern; Caddy leitet
  # /steelrumble/ws, /ws2, /ws3, /ws4 hierher)
  # Spielt die index.pck aus ./site/steelrumble (Branch "deploy" von markussauck-hub/steelrumble, siehe tools.list)
  steelrumble:
    build: ../repos/lincolnsoft-homestation/deploy/steelrumble
    image: lincolnsoft/steelrumble-server:3   # Tag erhöhen, wenn sich deploy/steelrumble ändert – dann baut "up -d" neu
    restart: unless-stopped
    volumes:
      - ./site:/site:ro
      - ./data/steelrumble:/home/game/.local/share/godot   # Konten, Vorschlagsboard und Raumstatus bleiben über Neustarts erhalten
    env_file: ${HOME}/.config/lincolnsoft/steelrumble.env   # STEELRUMBLE_ADMIN_KEY fürs Board; legt update.sh leer an (leer = keine Freigaben)
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
